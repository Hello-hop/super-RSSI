<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone.svg">
<title>Veille missions</title>
<style>
  :root{
    --encre:#0d1620; --panneau:#16212e; --trait:#24323f;
    --texte:#e7edf2; --sourdine:#7d8fa1;
    --cotation:#e0a63c; --traite:#4fa88b; --echu:#d1665b; --toulouse:#6ea8dc; --rayon:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--encre);color:var(--texte);
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding:0 14px calc(24px + env(safe-area-inset-bottom))}
  a{color:inherit}

  header{position:sticky;top:0;z-index:5;background:var(--encre);padding:18px 0 10px;
    border-bottom:1px solid var(--trait)}
  .eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--sourdine)}
  .titre-ligne{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{font-size:23px;margin:4px 0 10px;letter-spacing:-.02em;font-weight:650}
  #menu{background:none;border:0;color:var(--sourdine);font-size:20px;cursor:pointer;padding:4px 8px}
  #resume{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--sourdine);margin-bottom:12px}
  #resume b{color:var(--cotation);font-weight:600}

  nav{display:flex;gap:5px}
  #recherche{width:100%;margin:0 0 9px;padding:10px 12px;border-radius:var(--rayon);
    border:1px solid var(--trait);background:var(--panneau);color:var(--texte);
    font-size:15px;font-family:inherit;-webkit-appearance:none}
  /* 15px minimum : en dessous, iOS zoome automatiquement à la mise au point. */
  #recherche::placeholder{color:var(--sourdine)}
  #recherche:focus{border-color:var(--cotation);outline:none}
  /* Pendant une recherche, les onglets ne pilotent plus l'affichage : on le
     montre plutôt que de laisser croire à un onglet actif. */
  nav.inactif{opacity:.4}
  /* Empêche le navigateur d'interpréter le glissement horizontal comme un
     « page précédente », ce qui sortirait de l'application. */
  body{overscroll-behavior-x:contain;touch-action:pan-y}
  nav button{flex:1;background:transparent;border:1px solid var(--trait);color:var(--sourdine);
    padding:9px 2px;border-radius:var(--rayon);font-size:11.5px;font-weight:600;cursor:pointer}
  nav button[aria-selected="true"]{background:var(--panneau);color:var(--texte);border-color:var(--sourdine)}
  :focus-visible{outline:2px solid var(--cotation);outline-offset:2px}
  /* Missions écartées : présentes pour vérification, mais visuellement en retrait */
  .card.ecarte{opacity:.62}
  .card.ecarte h2 a{color:var(--sourdine)}

  #filtre-lieu{display:block;width:100%;margin-top:8px;background:transparent;
    border:1px solid var(--trait);color:var(--sourdine);padding:8px 4px;border-radius:var(--rayon);
    font-size:12.5px;font-weight:600;cursor:pointer}
  #filtre-lieu[aria-pressed="true"]{background:rgba(110,168,220,.14);color:var(--toulouse);
    border-color:var(--toulouse)}

  #liste{padding-top:14px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--panneau);border:1px solid var(--trait);border-left:3px solid var(--trait);
    border-radius:var(--rayon);padding:13px 14px}
  .card.echu{border-left-color:var(--echu)}
  .card.fort{border-left-color:var(--cotation)}
  /* Cadre distinct pour les missions toulousaines — indépendant de la cotation */
  .card.toulouse{box-shadow:0 0 0 1.5px var(--toulouse)}
  .puce-lieu{display:inline-flex;align-items:center;gap:4px;font-family:ui-monospace,Menlo,monospace;
    font-size:10px;letter-spacing:.06em;color:var(--toulouse);border:1px solid var(--toulouse);
    border-radius:20px;padding:2px 8px;margin-bottom:8px}

  /* Signature : la cotation en 5 segments, comme une ligne de registre de risques */
  .crit{display:flex;gap:3px;align-items:center;margin-bottom:9px}
  .crit i{width:16px;height:5px;border-radius:1px;background:#22303c;display:block}
  .crit i.on{background:var(--cotation)}
  .crit span{font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.12em;
    color:var(--sourdine);margin-left:7px;text-transform:uppercase}

  .card h2{font-size:15.5px;line-height:1.35;margin:0 0 6px;font-weight:600}
  .card h2 a{text-decoration:none}
  .card h2 a:active{color:var(--cotation)}
  .extrait{font-size:12.5px;line-height:1.45;color:var(--sourdine);margin:0 0 9px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--sourdine);margin-bottom:11px}
  .meta .drapeau{color:var(--echu)} .meta .statut{color:var(--traite)}
  .meta .rappel{color:var(--cotation)}

  .actions{display:flex;gap:6px}
  .act{flex:1;background:#1d2937;border:1px solid var(--trait);color:var(--texte);
    padding:9px 2px;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
  .act:active{transform:translateY(1px)}
  .act.oui{border-color:var(--traite);color:var(--traite)}
  .act.non{color:var(--sourdine)}

  .vide{border:1px dashed var(--trait);border-radius:var(--rayon);padding:26px 18px;text-align:center;
    color:var(--sourdine);font-size:13.5px;line-height:1.5}
  dialog{background:var(--panneau);color:var(--texte);border:1px solid var(--trait);
    border-radius:var(--rayon);padding:18px;max-width:320px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog button{display:block;width:100%;margin-top:8px;background:#1d2937;border:1px solid var(--trait);
    color:var(--texte);padding:11px;border-radius:8px;font-size:13.5px;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="eyebrow">registre des opportunités</div>
  <div class="titre-ligne">
    <h1>Veille missions</h1>
    <button id="menu" aria-label="Sauvegarde et options">⋯</button>
  </div>
  <div id="resume">chargement…</div>
  <input id="recherche" type="search" inputmode="search" autocomplete="off"
         placeholder="Rechercher dans toutes les catégories…"
         aria-label="Rechercher une mission par mots-clés">
  <nav id="onglets">
    <button data-vue="qualifier" aria-selected="true">À qualifier</button>
    <button data-vue="cours" aria-selected="false">En cours</button>
    <button data-vue="relances" aria-selected="false">Relances</button>
    <button data-vue="ecarte" aria-selected="false">Écarté</button>
  </nav>
  <button id="filtre-lieu" aria-pressed="false">📍 Toulouse uniquement</button>
</header>

<main id="liste"></main>

<dialog id="boite">
  <div class="eyebrow">sauvegarde</div>
  <p style="font-size:13px;line-height:1.5;color:#7d8fa1">
    Tes statuts et relances restent sur cet appareil. Exporte-les avant de changer de téléphone
    ou de vider le cache du navigateur.
  </p>
  <button id="exporter">Exporter le suivi</button>
  <button id="importer">Importer un suivi</button>
  <button id="fermer">Fermer</button>
  <input type="file" id="fichier" accept="application/json" hidden>
</dialog>

<script>
var CLE = 'veille.suivi.v1';
var OFFRES = [], SUIVI = {}, VUE = 'qualifier', FILTRE_TOULOUSE = false;
var RE_TOULOUSE = /toulouse|haute[- ]garonne|\b31\d{3}\b/i;

function estToulouse(o){
  // Les offres collectées après cette mise à jour portent le champ ; pour les
  // plus anciennes on retombe sur une détection dans le titre et l'extrait.
  if (typeof o.toulouse === 'boolean') return o.toulouse;
  return RE_TOULOUSE.test((o.titre || '') + ' ' + (o.extrait || ''));
}

function lireSuivi(){
  try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch(e){ return {}; }
}
function ecrireSuivi(){
  try { localStorage.setItem(CLE, JSON.stringify(SUIVI)); } catch(e){}
}

// Une même mission est republiée sous une nouvelle URL (LinkedIn change son
// identifiant, Free-Work repost l'annonce). Le suivi est donc indexé sur une
// SIGNATURE de mission — titre + entreprise normalisés — et non sur le lien :
// une republication hérite automatiquement du statut déjà donné.
var RE_BRUIT = /\b(h\s?\/?\s?f|f\s?\/?\s?h|hf|fh|cdi|cdd|freelance|junior|senior|confirmee?|confirmé|confirmée)\b/g;

function normaliser(s){
  return String(s || '')
    .toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(RE_BRUIT, ' ')
    .replace(/[^a-z0-9 ]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}

function signature(o){
  var ent = normaliser(o.entreprise);
  // Sans entreprise connue, deux clients distincts peuvent porter le même
  // intitulé générique ("Consultant GRC H/F") : on retombe alors sur le lien,
  // quitte à ne pas regrouper, plutôt que de masquer une offre à tort.
  return ent ? normaliser(o.titre) + '|' + ent : 'lien|' + o.lien;
}

function etat(o){ return SUIVI[signature(o)] || {}; }

// Les suivis d'avant cette version étaient indexés par URL : on les reporte
// une fois sur la nouvelle clé, pour ne perdre aucun statut déjà saisi.
function migrerSuivi(){
  var change = false;
  OFFRES.forEach(function(o){
    var ancien = SUIVI[o.lien];
    if (!ancien) return;
    var sig = signature(o);
    if (sig !== o.lien && !SUIVI[sig]) { SUIVI[sig] = ancien; change = true; }
  });
  if (change) ecrireSuivi();
}

function charger(){
  SUIVI = lireSuivi();
  fetch('data/offres.json', {cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ OFFRES = d.offres || []; migrerSuivi(); rendre(); })
    .catch(function(){
      document.getElementById('liste').innerHTML =
        '<div class="vide">Les offres n\'ont pas pu être chargées.<br>' +
        'Reconnecte-toi au réseau, puis rouvre l\'application.</div>';
    });
}

function estEchue(o){
  var e = etat(o);
  if (!e.relance) return false;
  if (['Perdu','Écarté','Gagné'].indexOf(e.statut) > -1) return false;
  var fin = new Date(); fin.setHours(23,59,59,999);
  return new Date(e.relance) <= fin;
}

// Une relance programmée, échue ou non : c'est ce qui peuple l'onglet Relances.
function aRelance(o){
  var e = etat(o);
  return !!e.relance && ['Perdu','Écarté','Gagné'].indexOf(e.statut) === -1;
}

// Recherche : normalisation légère (minuscules + accents retirés), distincte
// de normaliser() qui sert aux signatures et supprime « cdi », « h/f »… —
// termes qu'on doit justement pouvoir rechercher.
var REQUETE = '';

function aplatir(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function correspond(o){
  var mots = aplatir(REQUETE).split(/\s+/).filter(Boolean);
  if (!mots.length) return true;
  var champs = aplatir([o.titre, o.entreprise, o.extrait, o.source,
                        etat(o).statut, o.toulouse ? 'toulouse' : '',
                        o.remote ? 'remote teletravail' : ''].join(' '));
  // Tous les mots doivent être présents : taper « grc remote » restreint,
  // au lieu de renvoyer tout ce qui contient l'un ou l'autre.
  return mots.every(function(m){ return champs.indexOf(m) > -1; });
}

function filtrer(){
  var lot = OFFRES.filter(function(o){
    var e = etat(o), s = e.statut;
    if (FILTRE_TOULOUSE && !estToulouse(o)) return false;
    // Une recherche traverse toutes les catégories : l'onglet actif est
    // ignoré tant que le champ n'est pas vide.
    if (REQUETE) return correspond(o);
    if (VUE === 'qualifier') return !s && !e.relance;
    if (VUE === 'cours') return ['Postulé','Entretien','Négociation'].indexOf(s) > -1;
    if (VUE === 'ecarte') return s === 'Écarté';
    return aRelance(o);
  });
  if (VUE === 'relances' && !REQUETE) {   // la plus urgente en tête
    return lot.sort(function(a, b){
      return new Date(etat(a).relance) - new Date(etat(b).relance);
    });
  }
  return lot.sort(function(a, b){ return b.score - a.score; });
}

function rendre(){
  var base = FILTRE_TOULOUSE ? OFFRES.filter(estToulouse) : OFFRES;
  var aQualifier = base.filter(function(o){
    var e = etat(o); return !e.statut && !e.relance;
  }).length;
  var dues = base.filter(estEchue).length;
  var programmees = base.filter(aRelance).length;
  var lot = filtrer(), html = '';

  if (REQUETE){
    document.getElementById('resume').innerHTML =
      '<b>' + lot.length + '</b> résultat' + (lot.length > 1 ? 's' : '') +
      ' pour « ' + esc(REQUETE) + ' » <span style="color:var(--sourdine)">· toutes catégories</span>';
  } else {
    document.getElementById('resume').innerHTML =
      '<b>' + aQualifier + '</b> à qualifier &nbsp;·&nbsp; <b>' + programmees + '</b> relance' +
      (programmees > 1 ? 's' : '') + (dues ? ' <span style="color:#d1665b">(' + dues + ' due' +
      (dues > 1 ? 's' : '') + ')</span>' : '');
  }

  if (!lot.length){
    html = '<div class="vide">' + (
      REQUETE ? 'Aucune mission ne correspond à « ' + esc(REQUETE) + ' ».' :
      VUE === 'relances' ? 'Aucune relance programmée. Le bouton « Relancer dans 7 j » range une offre ici.' :
      VUE === 'cours' ? 'Rien en cours. Qualifie une offre pour ouvrir un dossier.' :
      VUE === 'ecarte' ? 'Aucune mission écartée pour l\'instant.' :
      'Tout est trié. Le prochain scan tourne demain matin.') + '</div>';
  } else {
    lot.forEach(function(o){
      var e = etat(o), echue = estEchue(o), toulouse = estToulouse(o), segs = '';
      var ecarte = e.statut === 'Écarté';
      for (var i = 1; i <= 5; i++) segs += '<i class="' + (i <= o.score ? 'on' : '') + '"></i>';
      html += '<article class="card ' + (echue ? 'echu' : (o.score >= 4 ? 'fort' : '')) +
        (toulouse ? ' toulouse' : '') + (ecarte ? ' ecarte' : '') + '">' +
        '<div class="crit" role="img" aria-label="Cotation ' + o.score + ' sur 5">' + segs +
          '<span>cotation ' + o.score + '/5</span></div>' +
        (toulouse ? '<span class="puce-lieu">📍 Toulouse</span><br>' : '') +
        '<h2><a href="' + esc(o.lien) + '" target="_blank" rel="noopener">' + esc(o.titre) + '</a></h2>' +
        (o.extrait ? '<p class="extrait">' + esc(o.extrait) + '</p>' : '') +
        '<div class="meta">' + esc(o.source) + ' · ' + esc(o.date) +
          (e.statut ? ' · <span class="statut">' + esc(e.statut) + '</span>' : '') +
          (echue ? ' · <span class="drapeau">relance due</span>'
                 : (e.relance ? ' · <span class="rappel">relance le ' + jjmm(e.relance) + '</span>' : '')) +
        '</div>' +
        '<div class="actions">' + (ecarte
          ? bouton(o.lien, 'statut:', 'Remettre à qualifier', '')
          : bouton(o.lien, 'statut:Postulé', 'Postulé', 'oui') +
            bouton(o.lien, 'relance:7', e.relance ? 'Repousser de 7 j' : 'Relancer dans 7 j', '') +
            bouton(o.lien, 'statut:Écarté', 'Écarter', 'non')) +
        '</div></article>';
    });
  }
  document.getElementById('liste').innerHTML = html;
}

function jjmm(iso){
  var d = new Date(iso);
  return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2);
}

function bouton(lien, action, texte, classe){
  return '<button class="act ' + classe + '" data-lien="' + esc(lien) +
         '" data-action="' + action + '">' + texte + '</button>';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function dans(jours){
  var d = new Date(); d.setDate(d.getDate() + jours);
  return d.toISOString().slice(0,10);
}

document.getElementById('liste').addEventListener('click', function(ev){
  var b = ev.target.closest('.act'); if (!b) return;
  var lien = b.getAttribute('data-lien');
  var offre = OFFRES.filter(function(x){ return x.lien === lien; })[0];
  if (!offre) return;
  var sig = signature(offre);
  var p = b.getAttribute('data-action').split(':');
  var e = SUIVI[sig] || (SUIVI[sig] = {});
  if (p[0] === 'statut'){
    if (!p[1]) {                                   // « Remettre à qualifier »
      delete SUIVI[sig];
      delete SUIVI[lien];                          // purge aussi l'ancienne clé par URL
    } else {
      e.statut = p[1];
      if (p[1] === 'Postulé') e.relance = dans(7); // la relance se pose toute seule
      if (p[1] === 'Écarté') delete e.relance;
    }
  } else {
    e.relance = dans(parseInt(p[1], 10));
  }
  ecrireSuivi(); rendre();
});

var VUES = ['qualifier', 'cours', 'relances', 'ecarte'];

function choisirVue(v){
  if (VUES.indexOf(v) === -1 || v === VUE) return;
  VUE = v;
  [].forEach.call(document.querySelectorAll('#onglets button'), function(x){
    x.setAttribute('aria-selected', x.getAttribute('data-vue') === v ? 'true' : 'false');
  });
  rendre();
  window.scrollTo(0, 0);
}

var champ = document.getElementById('recherche');
champ.addEventListener('input', function(){
  REQUETE = this.value.trim();
  document.getElementById('onglets').classList.toggle('inactif', !!REQUETE);
  rendre();
});
// Vider le champ rend la main aux onglets.
champ.addEventListener('search', function(){
  if (!this.value) { REQUETE = ''; document.getElementById('onglets').classList.remove('inactif'); rendre(); }
});

document.getElementById('onglets').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  var sortieDeRecherche = !!REQUETE;
  if (sortieDeRecherche) {   // cliquer un onglet sort de la recherche
    REQUETE = ''; champ.value = ''; this.classList.remove('inactif');
  }
  var v = b.getAttribute('data-vue');
  choisirVue(v);
  // choisirVue ne fait rien si l'onglet était déjà actif : il faut alors
  // redessiner soi-même pour afficher la sortie de recherche.
  if (sortieDeRecherche && v === VUE) rendre();
});

// ── Navigation par balayage ───────────────────────────────────────
// Un glissement horizontal fait défiler les onglets. Deux garde-fous :
// le geste doit être nettement plus horizontal que vertical (sinon on
// volerait le défilement de la liste), et assez ample pour ne pas se
// déclencher sur un simple appui tremblant.
var SEUIL = 60, tx = 0, ty = 0, tms = 0;

document.addEventListener('touchstart', function(ev){
  if (ev.touches.length !== 1) { tms = 0; return; }
  tx = ev.touches[0].clientX;
  ty = ev.touches[0].clientY;
  tms = Date.now();
}, {passive: true});

document.addEventListener('touchend', function(ev){
  if (!tms || !ev.changedTouches.length) return;
  if (REQUETE) { tms = 0; return; }   // en recherche, les onglets ne pilotent rien
  var dx = ev.changedTouches[0].clientX - tx;
  var dy = ev.changedTouches[0].clientY - ty;
  tms = 0;
  if (Math.abs(dx) < SEUIL) return;
  if (Math.abs(dx) < Math.abs(dy) * 1.8) return;   // geste trop vertical
  var i = VUES.indexOf(VUE) + (dx < 0 ? 1 : -1);   // vers la gauche = onglet suivant
  if (i < 0 || i >= VUES.length) return;           // pas de rebouclage : on sent la butée
  choisirVue(VUES[i]);
}, {passive: true});

document.getElementById('filtre-lieu').addEventListener('click', function(){
  FILTRE_TOULOUSE = !FILTRE_TOULOUSE;
  this.setAttribute('aria-pressed', String(FILTRE_TOULOUSE));
  rendre();
});

// ── Sauvegarde du suivi ───────────────────────────────────────────
var boite = document.getElementById('boite');
document.getElementById('menu').onclick = function(){ boite.showModal(); };
document.getElementById('fermer').onclick = function(){ boite.close(); };
document.getElementById('exporter').onclick = function(){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(SUIVI)], {type:'application/json'}));
  a.download = 'suivi-missions-' + new Date().toISOString().slice(0,10) + '.json';
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById('importer').onclick = function(){ document.getElementById('fichier').click(); };
document.getElementById('fichier').onchange = function(ev){
  var f = ev.target.files[0]; if (!f) return;
  var lecteur = new FileReader();
  lecteur.onload = function(){
    try {
      var recu = JSON.parse(lecteur.result);
      Object.keys(recu).forEach(function(k){ SUIVI[k] = recu[k]; });
      ecrireSuivi(); rendre(); boite.close();
    } catch(e){ alert('Fichier illisible : ' + e.message); }
  };
  lecteur.readAsText(f);
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
charger();
</script>
</body>
</html>
