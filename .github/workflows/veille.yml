name: Veille missions

on:
  schedule:
    # GitHub ne planifie qu'en UTC : les heures de Paris glissent donc d'une
    # heure entre l'été (UTC+2) et l'hiver (UTC+1).
    - cron: '0 2 * * *'      # 4 h à Paris en été, 3 h en hiver
    - cron: '0 9 * * *'      # 11 h à Paris en été, 10 h en hiver
  workflow_dispatch:          # bouton "Run workflow" — utilisable depuis le mobile

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Collecter les offres
        run: python3 scripts/veille.py

      - name: Publier les nouveautés
        run: |
          git config user.name  "veille-bot"
          git config user.email "actions@github.com"
          git add docs/data/offres.json
          if git diff --staged --quiet; then
            echo "Aucune nouvelle offre."
          else
            git commit -m "veille: scan du $(date -u +%Y-%m-%d)"
            git push
          fi
